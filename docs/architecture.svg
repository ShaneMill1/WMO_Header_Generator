<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="700" viewBox="0 0 1480 700" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#8a94a6"/>
    </marker>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1b2733" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="1480" height="700" fill="#ffffff"/>

  <style>
    .stage { fill:#9aa4b5; font-size:13px; font-weight:700; letter-spacing:1.5px; }
    .sub   { fill:#aab2c0; font-size:12px; }
    .node  { font-size:15px; }
    .nd    { font-size:14px; }
    .lbl   { fill:#6b7486; font-size:12.5px; }
    .srcname { fill:#4a235a; font-size:13.5px; font-weight:700; }
    .srcdesc { fill:#7a6a86; font-size:11px; }
    .mono  { font-family:'DejaVu Sans Mono', Menlo, monospace; }
  </style>

  <!-- ===================== (1) INPUT ===================== -->
  <text class="stage" x="60"  y="358">(1)  INPUT</text>
  <g filter="url(#soft)">
    <rect x="40" y="372" width="150" height="70" rx="10" fill="#eef2f7" stroke="#8a94a6"/>
  </g>
  <text class="node" x="115" y="402" text-anchor="middle" fill="#1b2733">icechunk /</text>
  <text class="node" x="115" y="423" text-anchor="middle" fill="#1b2733">zarr store</text>

  <!-- ===================== (2) IDENTIFY ===================== -->
  <text class="stage" x="250" y="316">(2)  IDENTIFY</text>
  <text class="sub"   x="250" y="334">what is this product?</text>
  <text class="sub" x="250" y="350" font-style="italic">different formats key on different fields</text>
  <g filter="url(#soft)">
    <rect x="250" y="360" width="250" height="74" rx="10" fill="#eaf2f8" stroke="#2874a6"/>
    <rect x="250" y="448" width="250" height="74" rx="10" fill="#eaf2f8" stroke="#2874a6"/>
  </g>
  <text class="nd" x="268" y="386" fill="#1b4f72" font-weight="700">GRIB2 metadata</text>
  <text class="nd mono" x="420" y="386" fill="#2874a6" font-style="italic" font-size="12">grib_identity</text>
  <text class="srcdesc" x="268" y="407" fill="#4a6885">grid + parameter + level, from the raw</text>
  <text class="srcdesc" x="268" y="422" fill="#4a6885">grib_section3 array or CF metadata.</text>
  <text class="nd" x="268" y="474" fill="#1b4f72" font-weight="700">NEXRAD metadata</text>
  <text class="nd mono" x="420" y="474" fill="#2874a6" font-style="italic" font-size="12">radar_identity</text>
  <text class="srcdesc" x="268" y="495" fill="#4a6885">no GRIB codes — keyed on product</text>
  <text class="srcdesc" x="268" y="510" fill="#4a6885">code + site + elevation instead.</text>

  <!-- ===================== (3) SOURCES ===================== -->
  <text class="stage" x="560" y="40">(3)  AUTHORITATIVE SOURCES</text>
  <text class="sub"   x="560" y="58">who officially assigned the header — pinned &amp; hash-verified (build_registry.py)</text>

  <!-- row 1 -->
  <g filter="url(#soft)">
    <rect x="560"  y="76"  width="290" height="78" rx="9" fill="#f4ecf7" stroke="#7d3c98"/>
    <rect x="870"  y="76"  width="290" height="78" rx="9" fill="#f4ecf7" stroke="#7d3c98"/>
  </g>
  <text class="srcname" x="575" y="104" font-size="12.5">tocgrib2 parm — GFS/GEFS/AQM/HRRR</text>
  <text class="srcdesc" x="575" y="123">NCEP's operational config that stamps the WMO</text>
  <text class="srcdesc" x="575" y="138">header onto each model GRIB2 product.</text>
  <text class="srcname" x="885" y="104">NOAAPort radar table (NEXRAD L3)</text>
  <text class="srcdesc" x="885" y="123">NWS list of which radar products are broadcast</text>
  <text class="srcdesc" x="885" y="138">on the SBN and under which SDUS heading.</text>

  <!-- row 2 -->
  <g filter="url(#soft)">
    <rect x="560"  y="168" width="290" height="78" rx="9" fill="#f4ecf7" stroke="#7d3c98"/>
    <rect x="870"  y="168" width="290" height="78" rx="9" fill="#f4ecf7" stroke="#7d3c98"/>
  </g>
  <text class="srcname" x="575" y="196">MRMS SBN notices</text>
  <text class="srcdesc" x="575" y="215">NWS bulletins assigning headers to MRMS</text>
  <text class="srcdesc" x="575" y="230">products by name (applied by IDP, not tocgrib2).</text>
  <text class="srcname" x="885" y="196">RTMA / URMA TINs</text>
  <text class="srcdesc" x="885" y="215">NWS Technical Implementation Notices giving</text>
  <text class="srcdesc" x="885" y="230">the header pieces for the analysis grids.</text>

  <!-- row 3 -->
  <g filter="url(#soft)">
    <rect x="560"  y="260" width="290" height="78" rx="9" fill="#f4ecf7" stroke="#7d3c98"/>
    <rect x="870"  y="260" width="290" height="78" rx="9" fill="#f4ecf7" stroke="#7d3c98"/>
  </g>
  <text class="srcname" x="575" y="288">WMO / GRIB2 code tables + grib2io</text>
  <text class="srcdesc" x="575" y="307">Reference tables identifying what a field IS</text>
  <text class="srcdesc" x="575" y="322">(parameter, level, process) — not the header.</text>
  <text class="srcname" x="885" y="288">XR-09 office directory</text>
  <text class="srcdesc" x="885" y="307">Official list of valid NWS office identifiers (CCCC),</text>
  <text class="srcdesc" x="885" y="322">used to sanity-check the originating-office code.</text>

  <!-- ===================== (4) RESOLVE ===================== -->
  <text class="stage" x="860" y="430">(4)  RESOLVE</text>
  <text class="sub"   x="860" y="448">match on each source's own key</text>
  <g filter="url(#soft)">
    <rect x="855" y="464" width="200" height="80" rx="12" fill="#fef9e7" stroke="#b7950b" stroke-width="1.6"/>
  </g>
  <text x="955" y="498" text-anchor="middle" fill="#7d6608" font-size="17" font-weight="700">resolver</text>
  <text x="955" y="520" text-anchor="middle" fill="#9a7d0a" font-size="12.5">resolves / does not resolve</text>

  <!-- ===================== (5) RESULT ===================== -->
  <text class="stage" x="1210" y="430">(5)  RESULT</text>
  <g filter="url(#soft)">
    <rect x="1210" y="448" width="220" height="74" rx="10" fill="#d5f5e3" stroke="#1e8449" stroke-width="1.6"/>
    <rect x="1210" y="540" width="220" height="74" rx="10" fill="#fadbd8" stroke="#c0392b"/>
  </g>
  <text x="1320" y="478" text-anchor="middle" fill="#145a32" font-size="14" font-weight="700">WMO HEADER</text>
  <text x="1320" y="500" text-anchor="middle" fill="#145a32" font-size="13" class="mono">T1T2A1A2ii CCCC</text>
  <text x="1320" y="516" text-anchor="middle" fill="#145a32" font-size="13" class="mono">YYGGgg</text>
  <text x="1320" y="572" text-anchor="middle" fill="#7b241c" font-size="14" font-weight="700">UNRESOLVED</text>
  <text x="1320" y="592" text-anchor="middle" fill="#7b241c" font-size="12.5">+ specific reason</text>

  <!-- ===================== EDGES ===================== -->
  <g fill="none" stroke="#8a94a6" stroke-width="1.6">
    <path d="M190,402 C222,402 222,397 248,397" marker-end="url(#arrow)"/>
    <path d="M190,412 C222,412 222,485 248,485" marker-end="url(#arrow)"/>
    <path d="M500,397 C670,397 680,490 853,490" marker-end="url(#arrow)"/>
    <path d="M500,485 C670,485 680,510 853,510" marker-end="url(#arrow)"/>
    <path d="M955,338 C955,400 955,430 955,462" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
    <path d="M1055,490 C1120,490 1130,483 1208,483" marker-end="url(#arrow)"/>
    <path d="M1055,518 C1120,518 1130,575 1208,575" marker-end="url(#arrow)"/>
  </g>
  <rect x="905" y="392" width="100" height="18" rx="4" fill="#f4ecf7"/>
  <text x="955" y="405" text-anchor="middle" class="lbl" fill="#7d3c98">look up sources</text>
  <rect x="1082" y="466" width="110" height="18" rx="4" fill="#eafaf1"/>
  <text x="1137" y="479" text-anchor="middle" class="lbl" fill="#1e8449">traces to a record</text>
  <rect x="1082" y="548" width="110" height="18" rx="4" fill="#fdeded"/>
  <text x="1137" y="561" text-anchor="middle" class="lbl" fill="#c0392b">no record exists</text>
</svg>
