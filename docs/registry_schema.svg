<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#8a94a6"/>
    </marker>
    <marker id="fk" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,4 L0,8" fill="none" stroke="#b7950b" stroke-width="1.6"/>
    </marker>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1b2733" flood-opacity="0.10"/>
    </filter>
  </defs>
  <rect width="1440" height="760" fill="#ffffff"/>
  <style>
    .title  { fill:#33415c; font-size:17px; font-weight:700; }
    .sub    { fill:#9aa4b5; font-size:13px; }
    .tname  { fill:#ffffff; font-size:15px; font-weight:700; font-family:'DejaVu Sans Mono',Menlo,monospace; }
    .col    { fill:#1b2733; font-size:13.5px; font-family:'DejaVu Sans Mono',Menlo,monospace; }
    .pk     { fill:#b7950b; font-size:11px; font-weight:700; }
    .note   { fill:#55617a; font-size:12.5px; }
    .lbl    { fill:#6b7486; font-size:12px; }
    .hdr    { fill:#55617a; font-size:12.5px; font-weight:700; letter-spacing:1px; }
  </style>

  <text class="title" x="40" y="44">registry.db — SQLite schema</text>
  <text class="sub"   x="40" y="66">build output of build_registry.py from the pinned sources in sources.json; the sole input the resolver loads</text>

  <!-- ===================== meta ===================== -->
  <g filter="url(#soft)">
    <rect x="40" y="100" width="300" height="118" rx="10" fill="#ffffff" stroke="#8a94a6"/>
    <rect x="40" y="100" width="300" height="34" rx="10" fill="#8a94a6"/>
    <rect x="40" y="118" width="300" height="16" fill="#8a94a6"/>
  </g>
  <text class="tname" x="58" y="123">meta</text>
  <text class="sub" x="210" y="123" fill="#eef2f7" font-size="12">build provenance</text>
  <text class="col" x="58" y="158"><tspan class="pk">PK </tspan>key    TEXT</text>
  <text class="col" x="58" y="182">    value  TEXT</text>
  <text class="note" x="58" y="206">schema_version, built_at</text>

  <!-- ===================== source ===================== -->
  <g filter="url(#soft)">
    <rect x="40" y="270" width="430" height="240" rx="10" fill="#ffffff" stroke="#7d3c98"/>
    <rect x="40" y="270" width="430" height="34" rx="10" fill="#7d3c98"/>
    <rect x="40" y="288" width="430" height="16" fill="#7d3c98"/>
  </g>
  <text class="tname" x="58" y="293">source</text>
  <text class="sub" x="300" y="293" fill="#f4ecf7" font-size="12">one row per registry source</text>
  <text class="col" x="58" y="330"><tspan class="pk">PK </tspan>id           TEXT</text>
  <text class="note" x="300" y="330">e.g. ncep-gfs-awips</text>
  <text class="col" x="58" y="356">    kind         TEXT</text>
  <text class="note" x="300" y="356">tocgrib2_parm, nws_notice…</text>
  <text class="col" x="58" y="382">    entry_count  INTEGER</text>
  <text class="col" x="58" y="408">    manifest     TEXT (JSON)</text>
  <rect x="56" y="422" width="398" height="74" rx="6" fill="#f4ecf7"/>
  <text class="note" x="68" y="442" fill="#4a235a">the per-source data that is NOT rows:</text>
  <text class="note" x="68" y="460" fill="#4a235a">grid specs · code tables · valid CCCC ·</text>
  <text class="note" x="68" y="478" fill="#4a235a">AWIPS xref · analysis T2/A1 tables ·</text>
  <text class="note" x="68" y="496" fill="#4a235a">grib2io abbrev→parameter map · provenance</text>

  <!-- ===================== entry ===================== -->
  <g filter="url(#soft)">
    <rect x="610" y="270" width="430" height="240" rx="10" fill="#ffffff" stroke="#2874a6"/>
    <rect x="610" y="270" width="430" height="34" rx="10" fill="#2874a6"/>
    <rect x="610" y="288" width="430" height="16" fill="#2874a6"/>
  </g>
  <text class="tname" x="628" y="293">entry</text>
  <text class="sub" x="870" y="293" fill="#eaf2f8" font-size="12">one row per registry entry</text>
  <text class="col" x="628" y="330"><tspan class="pk">PK </tspan>rowid      INTEGER</text>
  <text class="col" x="628" y="356"><tspan class="pk" fill="#b7950b">FK </tspan>source_id  TEXT</text>
  <text class="note" x="880" y="356">→ source.id (indexed)</text>
  <text class="col" x="628" y="382">    kind       TEXT</text>
  <text class="col" x="628" y="408">    data       TEXT (JSON)</text>
  <rect x="626" y="422" width="398" height="74" rx="6" fill="#eaf2f8"/>
  <text class="note" x="638" y="442" fill="#1b4f72">the row records, one dict each:</text>
  <text class="note" x="638" y="460" fill="#1b4f72">• nws_notice  → product_names, code, cccc, domain</text>
  <text class="note" x="638" y="478" fill="#1b4f72">• tocgrib2_parm → ttaaii, cccc, grid, pdt, desc …</text>
  <text class="note" x="638" y="496" fill="#1b4f72">• nexrad_radar → product_code, nnn, ttaaii_prefix …</text>

  <!-- FK edge source.id -> entry.source_id -->
  <path d="M470,360 C540,360 540,356 606,356" fill="none" stroke="#b7950b" stroke-width="1.6" marker-end="url(#fk)"/>
  <rect x="492" y="330" width="92" height="18" rx="4" fill="#fef9e7"/>
  <text x="538" y="343" text-anchor="middle" class="lbl" fill="#9a7d0a">1 source : N entries</text>

  <!-- JSON note -->
  <text class="note" x="610" y="536" fill="#8a94a6">Entries stay JSON (not shredded into columns): the three kinds have different fields and matching</text>
  <text class="note" x="610" y="554" fill="#8a94a6">runs in Python against the whole dict, so a parser can add a field without a schema migration.</text>

  <!-- ===================== how the resolver reads it ===================== -->
  <text class="hdr" x="40" y="600">HOW THE RESOLVER LOADS IT</text>
  <g filter="url(#soft)">
    <rect x="40" y="616" width="1360" height="120" rx="10" fill="#fbfcfe" stroke="#dde3ec"/>
  </g>
  <text class="col" x="60" y="648" font-size="13" fill="#1b2733">registry_db.read_db(path)</text>
  <text class="note" x="320" y="648">→ (manifest, entries) pairs — exactly what a LoadedSource held before.</text>

  <text class="col" x="60" y="680" font-size="13" fill="#1b2733">Registry.__init__</text>
  <text class="note" x="320" y="680">→ builds the in-memory lookup maps, unchanged from the file-based layout:</text>
  <text class="note" x="320" y="700" fill="#4a235a">by_product · by_grid · grid_specs · radar_by_code · abbrev_param · code_tables · valid_cccc · analysis_headers</text>
  <text class="note" x="60" y="722" fill="#8a94a6">sources.json stays the only hand-written, hash-pinned input; the database is just a container for build output.</text>
</svg>
