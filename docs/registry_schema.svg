<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="860" viewBox="0 0 1480 860" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="11" markerHeight="11" refX="8" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3.5 L0,7 Z" fill="#8a94a6"/>
    </marker>
    <filter id="soft" x="-8%" y="-8%" width="118%" height="128%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1b2733" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="1480" height="860" fill="#ffffff"/>
  <style>
    .h1   { fill:#33415c; font-size:19px; font-weight:700; }
    .sub  { fill:#8a94a6; font-size:14px; }
    .tag  { fill:#9aa4b5; font-size:12.5px; font-weight:700; letter-spacing:1.5px; }
    .lab  { fill:#33415c; font-size:15px; font-weight:700; }
    .txt  { fill:#55617a; font-size:13px; }
    .mono { font-family:'DejaVu Sans Mono',Menlo,monospace; }
    .kv   { fill:#1b2733; font-size:12.5px; font-family:'DejaVu Sans Mono',Menlo,monospace; }
    .kvk  { fill:#7a6a86; font-size:12.5px; font-family:'DejaVu Sans Mono',Menlo,monospace; }
    .pill { fill:#55617a; font-size:12px; }
  </style>

  <text class="h1"  x="40" y="46">registry.db — the tool's lookup library, in plain terms</text>
  <text class="sub" x="40" y="70">One file on disk. Think of it as a filing cabinet: a few folders, and inside each folder a stack of cards.</text>

  <!-- ============ FOLDER: source ============ -->
  <text class="tag" x="60" y="120">THE FOLDERS  —  one per official document the labels came from</text>

  <!-- folder tab + body -->
  <g filter="url(#soft)">
    <path d="M60 140 h150 l20 24 h300 a10 10 0 0 1 10 10 v150 a10 10 0 0 1 -10 10 h-470 a10 10 0 0 1 -10 -10 v-184 a10 10 0 0 1 10 -10 z"
          fill="#f4ecf7" stroke="#7d3c98" stroke-width="1.5"/>
  </g>
  <text class="lab" x="80" y="196" fill="#4a235a">Folder: “nws-mrms-sbn”</text>
  <text class="txt" x="80" y="218" fill="#6a4a7a">the NWS notice that lists MRMS products</text>
  <text class="txt" x="80" y="246" fill="#55617a">Each folder just records WHERE a set of labels</text>
  <text class="txt" x="80" y="264" fill="#55617a">came from, plus any reference tables that</text>
  <text class="txt" x="80" y="282" fill="#55617a">document needs. Other folders:</text>
  <text class="kvk" x="80" y="306">“ncep-gfs-awips”, “nws-noaaport-radar”, …</text>

  <!-- small stacked folders behind, hinting "many" -->
  <rect x="548" y="150" width="36" height="188" rx="8" fill="#efe4f5" stroke="#b98fd0"/>
  <rect x="560" y="158" width="36" height="188" rx="8" fill="#e7d6f0" stroke="#b98fd0"/>

  <!-- ============ CARDS: entry ============ -->
  <text class="tag" x="760" y="120">THE CARDS  —  one per product→label assignment inside a folder</text>

  <!-- card 1 -->
  <g filter="url(#soft)">
    <rect x="760" y="140" width="400" height="150" rx="10" fill="#ffffff" stroke="#2874a6" stroke-width="1.5"/>
  </g>
  <text class="lab" x="782" y="168" fill="#1b4f72">A card from the MRMS folder</text>
  <line x1="782" y1="178" x2="1138" y2="178" stroke="#dbe6f0"/>
  <text class="kvk" x="782" y="202">product</text><text class="kv" x="900" y="202">MultiSensor_QPE_24H_Pass2</text>
  <text class="kvk" x="782" y="224">region</text><text class="kv" x="900" y="224">CONUS</text>
  <text class="kv"  x="782" y="252" fill="#145a32">label “what” (TTAAII) = YAUP06</text>
  <text class="kv"  x="782" y="274" fill="#145a32">label “who”  (CCCC)   = KWNR</text>

  <!-- card 2 (radar) peeking -->
  <g filter="url(#soft)">
    <rect x="784" y="312" width="400" height="128" rx="10" fill="#ffffff" stroke="#2874a6" stroke-width="1.5"/>
  </g>
  <text class="lab" x="806" y="340" fill="#1b4f72">A card from the radar folder</text>
  <line x1="806" y1="350" x2="1162" y2="350" stroke="#dbe6f0"/>
  <text class="kvk" x="806" y="374">product code</text><text class="kv" x="952" y="374">165  (tilt 0.5°)</text>
  <text class="kv"  x="806" y="398" fill="#145a32">label “what” (TTAAII) = SDUS8</text>
  <text class="kv"  x="806" y="420" fill="#145a32">label “who”  (CCCC)   = from the radar site</text>

  <!-- folder -> cards arrow -->
  <path d="M600 232 C680 232 680 212 756 212" fill="none" stroke="#8a94a6" stroke-width="1.8" marker-end="url(#arr)"/>
  <rect x="612" y="196" width="150" height="20" rx="5" fill="#fef9e7"/>
  <text x="687" y="210" text-anchor="middle" class="pill" fill="#9a7d0a">one folder → many cards</text>

  <text class="txt" x="760" y="470" fill="#8a94a6">A card stores exactly what the document said — the product's description and its two label codes.</text>
  <text class="txt" x="760" y="490" fill="#8a94a6">Different product types fill in different fields, so each card is kept as free-form text, not rigid columns.</text>

  <!-- ============ HOW A LOOKUP WORKS ============ -->
  <text class="tag" x="60" y="560">HOW A LOOKUP WORKS</text>
  <g filter="url(#soft)">
    <rect x="60" y="580" width="1360" height="150" rx="12" fill="#fbfcfe" stroke="#dde3ec"/>
  </g>

  <!-- step boxes -->
  <g filter="url(#soft)"><rect x="92" y="612" width="300" height="86" rx="9" fill="#eef2f7" stroke="#8a94a6"/></g>
  <text class="lab" x="110" y="640" fill="#1b2733" font-size="14">1. Your dataset</text>
  <text class="txt" x="110" y="662">“I’m MultiSensor_QPE_24H_Pass2,</text>
  <text class="txt" x="110" y="680">over CONUS, from Sept 30 18:00.”</text>

  <path d="M400 655 h70" fill="none" stroke="#8a94a6" stroke-width="1.8" marker-end="url(#arr)"/>

  <g filter="url(#soft)"><rect x="486" y="612" width="320" height="86" rx="9" fill="#f4ecf7" stroke="#7d3c98"/></g>
  <text class="lab" x="504" y="640" fill="#4a235a" font-size="14">2. Find the matching card</text>
  <text class="txt" x="504" y="662" fill="#6a4a7a">look through the cards for the one whose</text>
  <text class="txt" x="504" y="680" fill="#6a4a7a">product + region match the dataset</text>

  <path d="M814 655 h70" fill="none" stroke="#8a94a6" stroke-width="1.8" marker-end="url(#arr)"/>

  <g filter="url(#soft)"><rect x="900" y="612" width="480" height="86" rx="9" fill="#d5f5e3" stroke="#1e8449" stroke-width="1.6"/></g>
  <text class="lab" x="920" y="640" fill="#145a32" font-size="14">3. Read the label off the card, add the time</text>
  <text class="kv"  x="920" y="668" fill="#145a32" font-size="15">YAUP06 KWNR 301800</text>
  <text class="pill" x="1150" y="668" fill="#45745a">↑ codes from card, time from data</text>

  <text class="sub" x="60" y="784">If no card matches, the tool says so and explains why — it never makes a label up. That “no label” answer is</text>
  <text class="sub" x="60" y="806">often correct: plenty of products are simply never broadcast, so they genuinely have no routing label.</text>
</svg>
