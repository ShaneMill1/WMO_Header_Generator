<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="860" viewBox="0 0 1480 860" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="11" markerHeight="11" refX="8" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3.5 L0,7 Z" fill="#8a94a6"/>
    </marker>
    <filter id="soft" x="-8%" y="-8%" width="118%" height="128%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1b2733" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="1480" height="860" fill="#ffffff"/>
  <style>
    .h1   { fill:#33415c; font-size:19px; font-weight:700; }
    .sub  { fill:#8a94a6; font-size:14px; }
    .tag  { fill:#9aa4b5; font-size:12.5px; font-weight:700; letter-spacing:1.5px; }
    .lab  { fill:#33415c; font-size:15px; font-weight:700; }
    .txt  { fill:#55617a; font-size:13px; }
    .mono { font-family:'DejaVu Sans Mono',Menlo,monospace; }
    .kv   { fill:#1b2733; font-size:12.5px; font-family:'DejaVu Sans Mono',Menlo,monospace; }
    .kvk  { fill:#7a6a86; font-size:12.5px; font-family:'DejaVu Sans Mono',Menlo,monospace; }
    .pill { fill:#55617a; font-size:12px; }
  </style>

  <text class="h1"  x="40" y="46">registry.db: the tool's lookup library (one SQLite file, three tables)</text>
  <text class="sub" x="40" y="70">Like a filing cabinet: folders = rows in the `source` table, cards = rows in the `entry` table. A `meta` table holds build info.</text>

  <!-- ============ FOLDER: source ============ -->
  <text class="tag" x="60" y="120">THE FOLDERS  =  source TABLE</text>

  <!-- folder tab + body -->
  <g filter="url(#soft)">
    <path d="M60 140 h150 l20 24 h300 a10 10 0 0 1 10 10 v176 a10 10 0 0 1 -10 10 h-470 a10 10 0 0 1 -10 -10 v-210 a10 10 0 0 1 10 -10 z"
          fill="#f4ecf7" stroke="#7d3c98" stroke-width="1.5"/>
  </g>
  <text class="lab" x="80" y="192" fill="#4a235a">source row (one folder)</text>
  <text class="kvk" x="80" y="214">id</text>          <text class="kv" x="210" y="214">"nws-mrms-sbn"</text>
  <text class="kvk" x="80" y="234">kind</text>        <text class="kv" x="210" y="234">"notice"</text>
  <text class="kvk" x="80" y="254">entry_count</text> <text class="kv" x="210" y="254">142</text>
  <text class="kvk" x="80" y="274">manifest</text>    <text class="kv" x="210" y="274">{…} JSON: where it came</text>
  <text class="kv"  x="210" y="292">from + reference tables</text>
  <text class="txt" x="80" y="316" fill="#8a94a6">other source rows: "ncep-gfs-awips", "nws-noaaport-radar", …</text>

  <!-- small stacked folders behind, hinting "many" -->
  <rect x="548" y="150" width="36" height="206" rx="8" fill="#efe4f5" stroke="#b98fd0"/>
  <rect x="560" y="158" width="36" height="206" rx="8" fill="#e7d6f0" stroke="#b98fd0"/>

  <!-- ============ CARDS: entry ============ -->
  <text class="tag" x="760" y="120">THE CARDS  =  entry TABLE  (linked to source by FK)</text>

  <!-- card 1 -->
  <g filter="url(#soft)">
    <rect x="760" y="140" width="400" height="162" rx="10" fill="#ffffff" stroke="#2874a6" stroke-width="1.5"/>
  </g>
  <text class="lab" x="782" y="166" fill="#1b4f72">entry row (MRMS)</text>
  <line x1="782" y1="176" x2="1138" y2="176" stroke="#dbe6f0"/>
  <text class="kvk" x="782" y="198">source_id</text><text class="kv" x="900" y="198">"nws-mrms-sbn"  (FK)</text>
  <text class="kvk" x="782" y="218">kind</text>     <text class="kv" x="900" y="218">"notice"</text>
  <text class="kvk" x="782" y="238">data</text>     <text class="kv" x="900" y="238">{ JSON blob } ↓</text>
  <text class="kv"  x="800" y="260" fill="#55617a">product = MultiSensor_QPE_24H_Pass2, region = CONUS</text>
  <text class="kv"  x="800" y="280" fill="#145a32">TTAAII = YAUP06   CCCC = KWNR</text>

  <!-- card 2 (radar) peeking -->
  <g filter="url(#soft)">
    <rect x="784" y="324" width="400" height="140" rx="10" fill="#ffffff" stroke="#2874a6" stroke-width="1.5"/>
  </g>
  <text class="lab" x="806" y="350" fill="#1b4f72">entry row (radar)</text>
  <line x1="806" y1="360" x2="1162" y2="360" stroke="#dbe6f0"/>
  <text class="kvk" x="806" y="382">source_id</text><text class="kv" x="952" y="382">"nws-noaaport-radar"  (FK)</text>
  <text class="kvk" x="806" y="402">data</text>     <text class="kv" x="952" y="402">{ JSON blob } ↓</text>
  <text class="kv"  x="824" y="424" fill="#55617a">product code = 165 (tilt 0.5°)</text>
  <text class="kv"  x="824" y="444" fill="#145a32">TTAAII = SDUS8   CCCC = radar site</text>

  <!-- folder -> cards arrow -->
  <path d="M600 232 C680 232 680 212 756 212" fill="none" stroke="#8a94a6" stroke-width="1.8" marker-end="url(#arr)"/>
  <rect x="604" y="196" width="166" height="20" rx="5" fill="#fef9e7"/>
  <text x="687" y="210" text-anchor="middle" class="pill" fill="#9a7d0a">source.id → entry.source_id</text>

  <text class="txt" x="760" y="494" fill="#8a94a6">Each entry's `data` is a JSON blob, not fixed columns: the three kinds (notice / parm / radar) carry</text>
  <text class="txt" x="760" y="514" fill="#8a94a6">different fields, and matching runs in Python over the full dict. An index on entry(source_id) speeds the join.</text>

  <!-- ============ HOW A LOOKUP WORKS ============ -->
  <text class="tag" x="60" y="560">HOW A LOOKUP WORKS</text>
  <g filter="url(#soft)">
    <rect x="60" y="580" width="1360" height="150" rx="12" fill="#fbfcfe" stroke="#dde3ec"/>
  </g>

  <!-- step boxes -->
  <g filter="url(#soft)"><rect x="92" y="612" width="300" height="86" rx="9" fill="#eef2f7" stroke="#8a94a6"/></g>
  <text class="lab" x="110" y="640" fill="#1b2733" font-size="14">1. Your dataset</text>
  <text class="txt" x="110" y="662">“I’m MultiSensor_QPE_24H_Pass2,</text>
  <text class="txt" x="110" y="680">over CONUS, from Sept 30 18:00.”</text>

  <path d="M400 655 h70" fill="none" stroke="#8a94a6" stroke-width="1.8" marker-end="url(#arr)"/>

  <g filter="url(#soft)"><rect x="486" y="612" width="320" height="86" rx="9" fill="#f4ecf7" stroke="#7d3c98"/></g>
  <text class="lab" x="504" y="640" fill="#4a235a" font-size="14">2. Find the matching entry row</text>
  <text class="txt" x="504" y="662" fill="#6a4a7a">load the source's entry rows, match on</text>
  <text class="txt" x="504" y="680" fill="#6a4a7a">product + region inside each `data` dict</text>

  <path d="M814 655 h70" fill="none" stroke="#8a94a6" stroke-width="1.8" marker-end="url(#arr)"/>

  <g filter="url(#soft)"><rect x="900" y="612" width="480" height="86" rx="9" fill="#d5f5e3" stroke="#1e8449" stroke-width="1.6"/></g>
  <text class="lab" x="920" y="640" fill="#145a32" font-size="14">3. Read TTAAII/CCCC off the row, add the time</text>
  <text class="kv"  x="920" y="668" fill="#145a32" font-size="15">YAUP06 KWNR 301800</text>
  <text class="pill" x="1150" y="668" fill="#45745a">↑ codes from row, time from data</text>

  <text class="sub" x="60" y="784">If no entry row matches, the tool says so and explains why; it never makes a label up. That "no label" answer is</text>
  <text class="sub" x="60" y="806">often correct: plenty of products are simply never broadcast, so they genuinely have no routing label.</text>
</svg>
